name: Laravel quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sellerboost_test
          POSTGRES_USER: sellerboost
          POSTGRES_PASSWORD: sellerboost_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sellerboost -d sellerboost_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sellerboost
      DB_PASSWORD: sellerboost_test_password
      ADMIN_EMAIL: admin@sellerboost.test
      ADMIN_PASSWORD: DemoSellerBoost!2026
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: vendor/bin/phpunit --configuration=phpunit.postgres.xml
      - run: php artisan view:cache
      # Laravel 11 is locked by the brief. Report advisories visibly until a stack upgrade is authorized.
      - name: Report locked-stack security advisories
        continue-on-error: true
        run: composer audit
